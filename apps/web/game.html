<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Flag Raid</title>
    <link rel="stylesheet" href="./command-panel.css" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #1a1a1a;
        color: #fff;
      }
      #ui {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 1rem;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
      }
      #score {
        font-size: 1.5rem;
        font-weight: bold;
      }
      #status, #fog, #frames {
        font-size: 0.85rem;
        opacity: 0.9;
      }
      #hud-side {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.2rem;
        max-width: 60%;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }
      #command-shell {
        position: absolute;
        top: 72px;
        left: 0;
        right: 0;
        bottom: 0;
      }
      #container {
        position: absolute;
        inset: 0;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <div id="score">Red 0 - 0 Bot</div>
      <div id="hud-side">
        <div id="round" hidden></div>
        <div id="status">Connecting...</div>
        <div id="fog">Fog: no snapshot data (view is not masked)</div>
        <div id="frames">Frames: none</div>
      </div>
    </div>
    <div id="command-shell">
      <div class="cp-arena-slot">
        <div id="container">
          <canvas id="canvas"></canvas>
        </div>
      </div>
      <div id="command-dock" class="cp-dock"></div>
    </div>
    <script type="module">
      import { Game } from "./game.js";

      const origin = window.location.origin;
      const game = new Game("canvas", origin);
      window.__flagRaid = game;
      game.start();
    </script>
  </body>
</html>
